<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Böschungsoberkante (Krone / Kamm): Sattes Grün, kräftig durchgezogen -->
  <line x1="4" y1="10" x2="44" y2="10" stroke="#2E7D32" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Böschungsunterkante (Fuß): Neutrales Grau, dezent gestrichelt -->
  <line x1="4" y1="38" x2="44" y2="38" stroke="#78909C" stroke-width="2.2" stroke-dasharray="3.5,2.5" stroke-linecap="round"/>
  
  <!-- Schraffen im klassischen Trassierungs-Erdbraun (#6E411E) nach DIN 2425 / RE 2012 -->
  <!-- 1. Lang -->
  <line x1="8" y1="10" x2="8" y2="38" stroke="#6E411E" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 2. Kurz (50%) -->
  <line x1="14" y1="10" x2="14" y2="24" stroke="#6E411E" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 3. Lang -->
  <line x1="20" y1="10" x2="20" y2="38" stroke="#6E411E" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 4. Kurz (50%) -->
  <line x1="26" y1="10" x2="26" y2="24" stroke="#6E411E" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 5. Lang -->
  <line x1="32" y1="10" x2="32" y2="38" stroke="#6E411E" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 6. Kurz (50%) -->
  <line x1="38" y1="10" x2="38" y2="24" stroke="#6E411E" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 7. Lang -->
  <line x1="44" y1="10" x2="44" y2="38" stroke="#6E411E" stroke-width="2.2" stroke-linecap="round"/>
</svg>